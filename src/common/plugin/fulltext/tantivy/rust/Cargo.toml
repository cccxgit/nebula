[package]
name = "nebula-tantivy"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nebula_tantivy"
crate-type = ["staticlib", "rlib"]

[dependencies]
tantivy = { version = "=0.25.0", default-features = false, features = ["mmap", "stopwords", "lz4-compression"] }
jieba-rs = "=0.8.1"

[patch.crates-io]
include-flate = { path = "vendor/include-flate" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
debug = 1
